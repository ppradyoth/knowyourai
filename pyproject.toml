[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "knowyourai"
version = "0.1.0"
description = "Check that the open-weight models on your machine are what they claim to be."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Pradyoth P." }]
keywords = ["ai-security", "supply-chain", "gguf", "safetensors", "llm", "provenance", "lockfile"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ppradyoth/knowyourai"
Issues = "https://github.com/ppradyoth/knowyourai/issues"

[project.scripts]
knowyourai = "knowyourai.cli:main"
kyai = "knowyourai.cli:main"

[dependency-groups]
dev = [{ include-group = "lint" }, { include-group = "test" }]
lint = ["ruff", "ty"]
test = ["pytest"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D",
  "COM812",
  "ISC001",
  "ANN401",
  "PLR2004",
  "C901",
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "PLR0917",
  "CPY",
  "SIM905",
  "TRY301",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN", "INP001", "SLF001", "ARG001", "TRY003", "EM101", "TC003"]
"study/*" = ["INP001", "T201"]
"src/knowyourai/report.py" = ["T201"]
"src/knowyourai/cli.py" = ["T201"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ty.environment]
python-version = "3.11"
